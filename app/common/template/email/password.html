<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no,email=no,address=no">
    <title>{site_name} 密码重置提醒</title>
    <style>
        body { margin: 0; padding: 0; background-color: #eef1f6; }
        table { border-collapse: collapse; }
        img { border: 0; outline: none; }
        @media only screen and (max-width: 620px) {
            .container { width: 100% !important; }
            .px { padding-left: 22px !important; padding-right: 22px !important; }
        }
    </style>
</head>
<body style="margin:0;padding:0;background-color:#eef1f6;">

<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#eef1f6;">
    <tr>
        <td align="center" style="padding:36px 14px;">

            <table role="presentation" class="container" width="600" border="0" cellpadding="0" cellspacing="0"
                   style="width:600px;max-width:600px;background-color:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(26,32,54,0.08);">

                <!-- 顶部警示条 -->
                <tr>
                    <td style="background-color:#ea580c;background-image:linear-gradient(135deg,#ea580c 0%,#f59e0b 100%);padding:30px 40px;">
                        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="font-size:22px;font-weight:700;color:#ffffff;letter-spacing:1px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
                                    {site_name}
                                </td>
                                <td align="right" style="font-size:13px;color:#ffe9d1;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
                                    安全中心
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- 正文 -->
                <tr>
                    <td class="px" style="padding:40px 40px 8px 40px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
                        <p style="margin:0 0 6px 0;font-size:20px;font-weight:700;color:#1a2036;line-height:1.5;">
                            密码重置提醒
                        </p>
                        <p style="margin:0;font-size:14px;color:#6b7280;line-height:1.7;">
                            您好，您的账号密码已于以下时间重置成功，如非本人操作请立即处理。
                        </p>
                    </td>
                </tr>

                <!-- 时间信息 -->
                <tr>
                    <td class="px" style="padding:20px 40px 0 40px;">
                        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
                               style="background-color:#fff7ed;border:1px solid #fed7aa;border-radius:10px;">
                            <tr>
                                <td style="padding:18px 20px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
                                    <p style="margin:0 0 4px 0;font-size:12px;color:#9a6b3f;letter-spacing:.5px;">重置时间</p>
                                    <p style="margin:0;font-size:17px;font-weight:700;color:#c2410c;">{create_time}</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- 安全建议 -->
                <tr>
                    <td class="px" style="padding:24px 40px 0 40px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
                        <p style="margin:0 0 12px 0;font-size:14px;font-weight:700;color:#1a2036;">安全建议</p>
                        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="padding:0 0 10px 0;font-size:13px;color:#6b7280;line-height:1.7;">
                                    <span style="color:#4f46e5;font-weight:700;">1.</span>&nbsp; 若为本人操作，请妥善保管新密码，不要与其他平台重复。
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:0 0 10px 0;font-size:13px;color:#6b7280;line-height:1.7;">
                                    <span style="color:#4f46e5;font-weight:700;">2.</span>&nbsp; 若非本人操作，请立即使用「忘记密码」重新设置，并检查账号登录记录。
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:0;font-size:13px;color:#6b7280;line-height:1.7;">
                                    <span style="color:#4f46e5;font-weight:700;">3.</span>&nbsp; 请勿向任何人透露密码或验证码，官方不会以任何形式索取。
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- 警示 -->
                <tr>
                    <td class="px" style="padding:24px 40px 40px 40px;">
                        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
                               style="background-color:#fef2f2;border-left:3px solid #dc2626;border-radius:6px;">
                            <tr>
                                <td style="padding:14px 18px;font-size:13px;color:#b91c1c;line-height:1.8;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
                                    如果重置密码并非您本人发起，请尽快联系客服冻结账号，以免造成损失。
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- 页脚 -->
                <tr>
                    <td style="background-color:#f7f8fa;padding:22px 40px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
                        <p style="margin:0;font-size:12px;color:#9aa0ac;line-height:1.8;">
                            此邮件由系统自动发送，请勿直接回复。<br>
                            © {year} {site_name} 保留所有权利。
                        </p>
                    </td>
                </tr>

            </table>

            <table role="presentation" width="600" class="container" border="0" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;">
                <tr>
                    <td align="center" style="padding:18px 10px 4px 10px;font-size:12px;color:#a8aebc;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
                        发送时间：{send_time}
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
