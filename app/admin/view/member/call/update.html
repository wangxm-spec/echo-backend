{extend name='public/_container'}
{block name="content"}
<div class="row">
    <form class="form-horizontal" id="doSubmit">
        <div class="col-sm-12">
            <div class="ibox ">
                <div class="ibox-content">
                    <div class="form-group">
                        <label class="col-sm-2 control-label">归属会员：</label>
                        <div class="col-sm-9">
                            <select name="uuid" class="form-control chosen" id="uuid">
                                <option value="">请选择会员</option>
                                {foreach $account_list as $item}
                                    <option value="{$item.uuid}" {if condition="$info.uuid == $item.uuid"}selected{/if}>{$item.nickname}（{$item.account}）</option>
                                {/foreach}
                            </select>
                            <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 称号归属于所选会员</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">称号名称：</label>
                        <div class="col-sm-9">
                            <input type="text" autocomplete="off" id="title" value="{$info.title|default=''}" name="title" class="form-control" placeholder="请输入称号名称">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">颜色：</label>
                        <div class="col-sm-9">
                            <div class="input-group colorpicker" id="colorpicker">
                                <span class="input-group-addon"><i style="background-color: {$info.color|default='#FF6600'};"></i></span>
                                <input type="text" autocomplete="off" id="color" value="{$info.color|default=''}" name="color" class="form-control" placeholder="如 #FF6600">
                            </div>
                            <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 点击左侧色块打开拾色器，留空为默认色</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">权限：</label>
                        <div class="col-sm-9">
                            <select name="role" class="form-control chosen" id="role">
                                <option value="common" {if condition="$info.role == 'common'"}selected{/if}>普通</option>
                                <option value="admin" {if condition="$info.role == 'admin'"}selected{/if}>管理员</option>
                                <option value="viewer" {if condition="$info.role == 'viewer'"}selected{/if}>观察者</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">状态：</label>
                        <div class="col-sm-9">
                            <select name="status" class="form-control chosen" id="status">
                                <option value="1" {if condition="(int)$info.status === 1"}selected{else/}selected{/if}>开启</option>
                                <option value="0" {if condition="(int)$info.status === 0"}selected{/if}>关闭</option>
                            </select>
                        </div>
                    </div>
                    <div class="hr-line-dashed"></div>
                    <div class="row btn-group-m-t">
                        <div class="col-sm-4"></div>
                        <div class="col-sm-4">
                            <button type="button" class="btn btn-primary" onclick="InfoDlg.submit()" id="ensure">
                                <i class="fa fa-check"></i>&nbsp;确认提交
                            </button>
                            <button type="button" class="btn btn-danger" onclick="InfoDlg.close()" id="cancel"
                                    style="margin-left: 20px">
                                <i class="fa fa-remove"></i>&nbsp;取消关闭
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<script src="/static/admin/js/common/formCom.js" charset="utf-8"></script>
<link href="/static/admin/css/plugins/colorpicker/css/bootstrap-colorpicker.min.css" rel="stylesheet">
<script src="/static/admin/js/plugins/colorpicker/bootstrap-colorpicker.min.js"></script>
<script type="text/javascript">

    InfoDlg.collectData = function () {
        this.set('uuid').set('title').set('color').set('role').set('status');
    }

    InfoDlg.Validate = function () {
        if ($('#uuid').val() === '') {
            com.error('请选择归属会员');
            return false;
        }
        if ($('#title').val() === '') {
            com.error('请输入称号名称');
            return false;
        }
        return true;
    }

    InfoDlg.submit = function () {
        this.ajaxSubmit("{:url('admin/member/call/update',['id'=>$id])}");
    };

    $(function () {
        if ($.fn.colorpicker) {
            $('#colorpicker').colorpicker().on('changeColor', function (ev) {
                $('#color').val(ev.color.toHex());
            });
        }
    });

</script>

{/block}
