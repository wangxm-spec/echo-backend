{extend name='public/_container'}
{block name="content"}
<div class="row">
    <div class="col-sm-12">
        <div class="ibox float-e-margins">
            <div class="ibox-content">
                <div class="row row-lg">
                    <div class="col-sm-12">
                        <div class="row" id="searchGroup">
                            <div class="col-sm-3">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">关键字</button>
                                    </div>
                                    <input type="text" autocomplete="off" class="form-control" id="keywords" placeholder="角色名称/备注"/>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">状态</button>
                                    </div>
                                    <select class="form-control chosen" id="status">
                                        <option value="">请选择</option>
                                        <option value="1">正常</option>
                                        <option value="0">禁用</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <button type="button" class="btn btn-success" onclick="TableList.search()">
                                    <i class="fa fa-search"></i>&nbsp;搜索
                                </button>
                            </div>
                        </div>
                        <div class="btn-group-sm pull-left" id="TableToolbar" role="group" style="margin-top: 15px;">
                            {if condition="$is_super_admin == 1 || in_array('admin/member/character/delete', $admin_rule)"}
                            <button type="button" id="delete" class="btn btn-danger button-margin" onclick="TableList.delete()">
                                <i class="fa fa-trash"></i>&nbsp;删除
                            </button>
                            {/if}
                        </div>
                        <table id="TableList" data-mobile-responsive="true" data-click-to-select="true">
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/admin/js/common/listCom.js" charset="utf-8"></script>
<script>
    var TableList = {id: "TableList", seItem: null, table: null, layerIndex: -1};

    TableList.initColumn = function () {
        return [
            {field: 'selectItem', checkbox: true},
            {title: '角色ID', field: 'cuid', visible: true, align: 'center', valign: 'middle'},
            {title: '角色名称', field: 'name', visible: true, align: 'center', valign: 'middle'},
            {title: '头像', field: 'icon', visible: true, align: 'center', valign: 'middle', formatter: listCom.picFormatter},
            {title: '归属用户', field: 'nickname', visible: true, align: 'center', valign: 'middle'},
            {title: '生日', field: 'birth', visible: true, align: 'center', valign: 'middle'},
            {title: '主人称呼', field: 'loader_call', visible: true, align: 'center', valign: 'middle'},
            {title: '刚性系数', field: 'rigidity', visible: true, align: 'center', valign: 'middle'},
            {title: '状态', field: 'status', visible: true, align: 'center', valign: 'middle', formatter: TableList.statusFormatter},
            {title: '创建时间', field: 'create_time', visible: true, align: 'center', valign: 'middle'},
            {title: '操作', field: '', visible: true, align: 'center', valign: 'middle', formatter: TableList.buttonFormatter},
        ];
    };

    TableList.statusFormatter = function (value, row, index) {
        if (value == 1) {
            return '<span class="label label-primary">正常</span>';
        }
        return '<span class="label label-default">禁用</span>';
    };

    TableList.buttonFormatter = function (value, row, index) {
        var str = '';
        {if condition="$is_super_admin == 1 || in_array('admin/member/character/detail', $admin_rule)"}
        str += '<button type="button" class="btn btn-info btn-xs" onclick="TableList.detail(\'' + row.cuid + '\')"><i class="fa fa-search-plus"></i>&nbsp;详情</button>&nbsp;';
        {/if}
        {if condition="$is_super_admin == 1 || in_array('admin/member/character/file', $admin_rule)"}
        str += '<button type="button" class="btn btn-primary btn-xs" onclick="TableList.file(\'' + row.cuid + '\')"><i class="fa fa-file"></i>&nbsp;文件信息</button>&nbsp;';
        {/if}
        {if condition="$is_super_admin == 1 || in_array('admin/member/character/delete', $admin_rule)"}
        str += '<button type="button" class="btn btn-danger btn-xs" onclick="TableList.delete(\'' + row.cuid + '\')"><i class="fa fa-trash"></i>&nbsp;删除</button>';
        {/if}
        return str;
    };

    TableList.formParams = function () {
        var queryData = {};
        queryData['keywords'] = $("#keywords").val();
        queryData['status']   = $("#status").val();
        return queryData;
    };

    TableList.detail = function (value) {
        layer.open({
            type: 2,
            title: '角色详情',
            area: ['860px', '85%'],
            fix: true,
            content: "{:url('admin/member/character/detail')}?cuid=" + value
        });
    };

    TableList.file = function (value) {
        layer.open({
            type: 2,
            title: '角色文件信息',
            area: ['900px', '80%'],
            fix: true,
            content: "{:url('admin/member/character/file')}?cuid=" + value
        });
    };

    TableList.delete = function (value) {
        var ids = value ? value : '';
        if (!ids) {
            var selected = $('#TableList').bootstrapTable('getSelections');
            if (selected.length === 0) {
                layer.msg('请先选中表格中的记录！', {icon: 2});
                return;
            }
            ids = selected.map(function(item){ return item.cuid; }).join(',');
        }
        layer.confirm('确定要删除选中的记录吗？', function(index){
            $.ajax({
                url: "{:url('admin/member/character/delete')}",
                type: 'POST',
                data: {cuid: ids},
                dataType: 'json',
                success: function(res){
                    if (res.status === 200) { layer.msg(res.msg, {icon: 1}); TableList.table.refresh(); }
                    else { layer.msg(res.msg, {icon: 2}); }
                }
            });
            layer.close(index);
        });
    };

    TableList.search = function () {
        TableList.table.refresh({query: TableList.formParams()});
    };

    $(function () {
        var table = new BSTable(TableList.id, "{:url('admin/member/character/index')}" + location.search, TableList.initColumn());
        table.setQueryParams(TableList.formParams());
        TableList.table = table.init();
    });
</script>
{/block}
