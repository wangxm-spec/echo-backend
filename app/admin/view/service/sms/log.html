{extend name='public/_container'}
{block name="content"}
<div class="row">
    <div class="col-sm-12">
        <div class="ibox float-e-margins">
            <div class="ibox-content">
                <div class="row row-lg">
                    <div class="col-sm-12">
                        <div class="row" id="searchGroup">
                            <div class="col-sm-3">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">手机号</button>
                                    </div>
                                    <input type="text" autocomplete="off" class="form-control" id="mobile" placeholder="请输入手机号"/>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">类型</button>
                                    </div>
                                    <select class="form-control chosen" id="type">
                                        <option value="">全部类型</option>
                                        {foreach $type_list as $key => $item}
                                            <option value="{$key}">{$item}</option>
                                        {/foreach}
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">状态</button>
                                    </div>
                                    <select class="form-control chosen" id="status">
                                        <option value="">全部状态</option>
                                        {foreach $status_list as $key => $item}
                                            <option value="{$key}">{$item}</option>
                                        {/foreach}
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">发送时间</button>
                                    </div>
                                    <input type="text" autocomplete="off" class="form-control" id="create_time" placeholder="开始时间 - 结束时间"/>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <button type="button" class="btn btn-success" onclick="TableList.search()">
                                    <i class="fa fa-search"></i>&nbsp;搜索
                                </button>
                            </div>
                        </div>
                        <table id="TableList" data-mobile-responsive="true" data-click-to-select="true">
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/admin/js/common/listCom.js" charset="utf-8"></script>
<script>
    var TableList = {id: "TableList", seItem: null, table: null, layerIndex: -1};

    TableList.initColumn = function () {
        return [
            {title: '编号', field: 'id', visible: true, align: 'center', valign: 'middle'},
            {title: '手机号', field: 'mobile', visible: true, align: 'center', valign: 'middle'},
            {title: '验证码', field: 'code', visible: true, align: 'center', valign: 'middle'},
            {title: '类型', field: 'type_text', visible: true, align: 'center', valign: 'middle'},
            {title: '状态', field: 'status_text', visible: true, align: 'center', valign: 'middle'},
            {title: '剩余验证次数', field: 'error_count', visible: true, align: 'center', valign: 'middle'},
            {title: '发送时间', field: 'create_time', visible: true, align: 'center', valign: 'middle'},
            {title: '更新时间', field: 'update_time', visible: true, align: 'center', valign: 'middle'},
        ];
    };

    TableList.formParams = function () {
        var queryData = {};
        queryData['mobile']      = $("#mobile").val();
        queryData['type']        = $("#type").val();
        queryData['status']      = $("#status").val();
        queryData['create_time'] = $("#create_time").val();
        return queryData;
    };

    TableList.search = function () {
        TableList.table.refresh({query: TableList.formParams()});
    };

    $(function () {
        laydate.render({elem: '#create_time', range: ' - '});
        var table = new BSTable(TableList.id, "{:url('admin/service/sms/log')}" + location.search, TableList.initColumn());
        table.setQueryParams(TableList.formParams());
        TableList.table = table.init();
    });
</script>
{/block}
