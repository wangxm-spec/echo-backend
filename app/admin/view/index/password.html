<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{:config('site.site_short')} - 修改密码</title>
    <link href="/static/admin/css/bootstrap.min.css?v=3.3.7" rel="stylesheet" />
    <link href="/static/admin/css/font-awesome.min.css?v=4.4.0" rel="stylesheet" />
    <link href="/static/admin/css/animate.css" rel="stylesheet" />
    <link href="/static/admin/css/style.css?v=4.1.0" rel="stylesheet" />
</head>
<body class="gray-bg">
    <div class="wrapper wrapper-content">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-content">
                        <form class="form-horizontal" id="doSubmit">
                            <div class="form-group">
                                <label class="col-sm-3 control-label">原密码：</label>
                                <div class="col-sm-7">
                                    <input type="password" id="old_password" name="old_password" class="form-control" placeholder="请输入原密码" autocomplete="off">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label">新密码：</label>
                                <div class="col-sm-7">
                                    <input type="password" id="password" name="password" class="form-control" placeholder="请输入新密码" autocomplete="off">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label">确认密码：</label>
                                <div class="col-sm-7">
                                    <input type="password" id="password_confirm" name="password_confirm" class="form-control" placeholder="再次输入新密码" autocomplete="off">
                                </div>
                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="row btn-group-m-t">
                                <div class="col-sm-12 text-center">
                                    <button type="button" class="btn btn-primary" onclick="PasswordDlg.submit()">
                                        <i class="fa fa-check"></i>&nbsp;确认修改
                                    </button>
                                    <button type="button" class="btn btn-danger" onclick="PasswordDlg.close()" style="margin-left: 20px">
                                        <i class="fa fa-remove"></i>&nbsp;取消
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/admin/js/jquery.min.js"></script>
    <script src="/static/admin/js/bootstrap.min.js"></script>
    <script src="/static/admin/js/plugins/layer/layer.min.js"></script>
    <script src="/static/admin/js/common.js"></script>
    <script>
        var PasswordDlg = {
            submit: function () {
                var old = $('#old_password').val();
                var pwd = $('#password').val();
                var cfm = $('#password_confirm').val();
                if (!old) { layer.msg('请输入原密码', {icon: 2}); return; }
                if (!pwd) { layer.msg('请输入新密码', {icon: 2}); return; }
                if (pwd !== cfm) { layer.msg('两次输入的密码不一致', {icon: 2}); return; }

                $.ajax({
                    url: "{:url('admin/index/password')}",
                    type: 'POST',
                    data: {old_password: old, password: pwd, password_confirm: cfm},
                    dataType: 'json',
                    success: function (res) {
                        if (res.status === 200) {
                            layer.msg(res.msg, {icon: 1, time: 1500}, function(){
                                parent.location.href = "{:url('login/index')}";
                            });
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    }
                });
            },
            close: function () {
                var index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
            }
        };
    </script>
</body>
</html>
