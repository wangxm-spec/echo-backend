<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{:config('site.site_short')} - 后台首页</title>
    <link rel="icon" type="image/png" href="/static/logo.svg" sizes="32x32">
    <link href="/static/admin/css/bootstrap.min.css?v=3.3.7" rel="stylesheet" />
    <link href="/static/admin/css/font-awesome.min.css?v=4.4.0" rel="stylesheet" />
    <link href="/static/admin/css/animate.css" rel="stylesheet" />
    <link href="/static/admin/css/style.css?v=4.1.0" rel="stylesheet" />
</head>

<body class="gray-bg">
    <div class="wrapper wrapper-content">
        <div class="row">
            <div class="col-sm-12">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        平台数据概览
                    </div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-sm-3">
                                <div class="widget style1 navy-bg">
                                    <div class="row vertical-align">
                                        <div class="col-xs-3">
                                            <i class="fa fa-users fa-3x"></i>
                                        </div>
                                        <div class="col-xs-9 text-right">
                                            <span>会员总数</span>
                                            <h2 class="font-bold">{$member_count|default=0}</h2>
                                            <small class="text-muted" style="color:#fff;opacity:.85;">启用状态的注册会员</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/admin/js/jquery.min.js"></script>
    <script src="/static/admin/js/bootstrap.min.js"></script>

</body>
</html>
