{extend name='public/_container'}
{block name="content"}
<div class="row">
    <div class="col-sm-12">
        <div class="ibox float-e-margins">
            <div class="ibox-content">
                <div class="row" style="margin-bottom:15px;">
                    <div class="col-sm-12">
                        <h3 style="margin-top:0;">角色：<strong>{$info.name|default=''}</strong></h3>
                        <p class="text-muted">勾选需要分配的菜单/按钮权限节点</p>
                    </div>
                </div>
                <div id="tree" class="demo" style="overflow-y: auto; min-height: 360px;"></div>
                <div class="form-group" style="margin-top: 20px;">
                    <div class="col-sm-12 text-center">
                        <button type="button" class="btn btn-primary" onclick="getMenuIds()">
                            <i class="fa fa-save"></i> 保存权限
                        </button>
                        <button type="button" class="btn btn-default" onclick="checkAll()">
                            <i class="fa fa-check-square-o"></i> 全选
                        </button>
                        <button type="button" class="btn btn-default" onclick="uncheckAll()">
                            <i class="fa fa-square-o"></i> 取消全选
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="/static/admin/css/plugins/jsTree/style.min.css"/>
<script src="/static/admin/js/plugins/jsTree/jstree.js"></script>
<script>
    var treeObj;
    var selectedRules = [];

    $(document).ready(function(){
        treeObj = $('#tree').jstree({
            plugins: ["checkbox", "search"],
            "checkbox": {
                "keep_selected_style": false,
                "three_state": false,
                "cascade": 'down+up'
            },
            'core': {
                'data': {:htmlspecialchars_decode($nodes)}
            }
        });
    });

    function checkAll()  { $('#tree').jstree(true).check_all(); }
    function uncheckAll(){ $('#tree').jstree(true).uncheck_all(); }

    function getMenuIds() {
        var idx = [];
        $("#tree .jstree-clicked").each(function () {
            var dataId = $(this).parent().attr('data-id') || $(this).attr('data-id');
            if (dataId) {
                idx.push(dataId);
            }
        });

        $.ajax({
            url: "{:url('admin/role/auth')}",
            type: 'POST',
            data: {id: {$info.id|default=0}, idx: idx},
            dataType: 'json',
            success: function(res) {
                if (res.status === 200) {
                    parent.layer.msg(res.msg, {icon: 1});
                    parent.location.reload();
                    parent.layer.closeAll();
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            }
        });
    }
</script>
{/block}
