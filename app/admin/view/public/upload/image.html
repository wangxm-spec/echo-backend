{extend name='public/_container'}
{block name="content"}
<style>
    .upload-box { padding: 24px; }

    /* 拖拽 / 预览 共用外框 */
    .upload-area {
        position: relative;
        border: 2px dashed #d9dde3;
        border-radius: 10px;
        background: #fafbfc;
        min-height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all .25s ease;
        user-select: none;
        overflow: hidden;
    }
    .upload-area:hover {
        border-color: #1ab394;
        background: #f0fbf8;
    }
    .upload-area.dragover {
        border-color: #1ab394;
        background: #e8f8f4;
        transform: scale(1.01);
    }
    .upload-area.loading {
        pointer-events: none;
        opacity: .7;
    }

    /* 空状态：图标 + 文案 */
    .upload-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
    }
    .upload-empty .icon-wrap {
        width: 72px;
        height: 72px;
        margin-bottom: 16px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1ab394, #16a085);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 16px rgba(26,179,148,.3);
        transition: transform .25s ease;
    }
    .upload-area:hover .icon-wrap { transform: translateY(-3px); }
    .upload-empty .icon-wrap i { font-size: 32px; color: #fff; }
    .upload-empty .main-text {
        font-size: 15px;
        color: #333;
        font-weight: 500;
        margin-bottom: 6px;
    }
    .upload-empty .sub-text { font-size: 12px; color: #999; }
    .upload-empty .sub-text em { color: #1ab394; font-style: normal; }

    /* 预览状态：图片铺满 */
    .upload-preview {
        display: none;
        width: 100%;
        height: 100%;
        position: relative;
    }
    .upload-preview img {
        display: block;
        width: 100%;
        height: 100%;
        max-height: 320px;
        object-fit: contain;
        background: #f5f5f5;
        border-radius: 8px;
    }
    /* 悬停时覆盖层 */
    .upload-preview .mask {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,.45);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        opacity: 0;
        transition: opacity .2s;
        border-radius: 8px;
    }
    .upload-preview:hover .mask { opacity: 1; }
    .upload-preview .mask .action {
        cursor: pointer;
        text-align: center;
        font-size: 12px;
    }
    .upload-preview .mask .action i {
        display: block;
        font-size: 22px;
        margin-bottom: 4px;
    }
    .upload-preview .mask .action:hover { color: #1ab394; }

    /* 底部按钮 */
    .footer-btns { margin-top: 24px; text-align: center; }
    .footer-btns .btn {
        min-width: 96px;
        margin: 0 6px;
        border-radius: 6px;
        padding: 8px 20px;
        font-size: 14px;
    }
    .footer-btns .btn-primary {
        background: #1ab394;
        border-color: #1ab394;
    }
    .footer-btns .btn-primary:hover:not(:disabled) {
        background: #16a085;
        border-color: #16a085;
    }
    .footer-btns .btn-primary:disabled {
        opacity: .5;
        cursor: not-allowed;
    }
</style>

<div class="upload-box">
    <!-- 上传 / 预览 同一个框 -->
    <div class="upload-area" id="uploadArea">

        <!-- 空状态 -->
        <div class="upload-empty" id="emptyState">
            <div class="icon-wrap">
                <i class="fa fa-cloud-upload"></i>
            </div>
            <div class="main-text">点击或拖拽图片到此处上传</div>
            <div class="sub-text">支持 <em>jpg / png / gif / webp</em>，单张不超过 <em>5MB</em></div>
        </div>

        <!-- 预览状态 -->
        <div class="upload-preview" id="previewState">
            <img id="previewImg" src="" alt="预览">
            <div class="mask">
                <div class="action" id="reuploadBtn">
                    <i class="fa fa-refresh"></i>重新上传
                </div>
                <div class="action" id="removeBtn">
                    <i class="fa fa-trash-o"></i>移除
                </div>
            </div>
        </div>

    </div>

    <div class="footer-btns">
        <button type="button" class="btn btn-primary" id="confirmBtn" disabled>确认选择</button>
        <button type="button" class="btn btn-default"
                onclick="parent.layer.close(parent.layer.getFrameIndex(window.name))">取消</button>
    </div>
</div>

<input type="file" id="fileInput" style="display:none;" accept="image/*">

<script>
    (function () {
        var selectedUrl = '';
        var uploading = false;
        var fieldParam = new URLSearchParams(window.location.search).get('field') || 'image';

        var $area    = $('#uploadArea');
        var $input   = $('#fileInput');
        var $empty   = $('#emptyState');
        var $preview = $('#previewState');
        var $img     = $('#previewImg');
        var $confirm = $('#confirmBtn');

        /* ---------- 显示预览 / 显示空状态 ---------- */
        function showPreview(url) {
            selectedUrl = url;
            $img.attr('src', url);
            $empty.hide();
            $preview.css('display', 'block');
            $confirm.prop('disabled', false);
        }
        function showEmpty() {
            selectedUrl = '';
            $img.attr('src', '');
            $preview.hide();
            $empty.show();
            $confirm.prop('disabled', true);
        }

        /* ---------- 点击空状态 -> 选文件 ---------- */
        $empty.on('click', function (e) {
            e.stopPropagation();
            if (uploading) return;
            $input.val('');
            $input.click();
        });

        /* ---------- 点击预览里的"重新上传" ---------- */
        $('#reuploadBtn').on('click', function (e) {
            e.stopPropagation();
            if (uploading) return;
            $input.val('');
            $input.click();
        });

        /* ---------- 点击预览里的"移除" ---------- */
        $('#removeBtn').on('click', function (e) {
            e.stopPropagation();
            showEmpty();
            $input.val('');
        });

        /* ---------- 拖拽 ---------- */
        $area.on('dragover', function (e) {
            e.preventDefault();
            e.stopPropagation();
            $area.addClass('dragover');
        });
        $area.on('dragleave', function (e) {
            e.preventDefault();
            e.stopPropagation();
            $area.removeClass('dragover');
        });
        $area.on('drop', function (e) {
            e.preventDefault();
            e.stopPropagation();
            $area.removeClass('dragover');
            if (uploading) return;
            var files = e.originalEvent.dataTransfer.files;
            if (files && files.length > 0) {
                uploadFile(files[0]);
            }
        });

        /* ---------- input change ---------- */
        $input.on('change', function () {
            if (this.files && this.files.length > 0) {
                uploadFile(this.files[0]);
            }
        });

        /* ---------- 上传 ---------- */
        function uploadFile(file) {
            if (!file.type || !file.type.match(/^image\//)) {
                layer.msg('请选择图片文件', { icon: 2 });
                $input.val('');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                layer.msg('图片不能超过 5MB', { icon: 2 });
                $input.val('');
                return;
            }
            if (uploading) return;
            uploading = true;
            $area.addClass('loading');

            var formData = new FormData();
            formData.append('file', file);

            $.ajax({
                url: "{:url('upload/image')}",
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                dataType: 'json',
                beforeSend: function () {
                    layer.load(2, { shade: [0.3, '#000'] });
                },
                success: function (res) {
                    layer.closeAll('loading');
                    if (res.status === 200 || res.code === 0 || res.code === 200) {
                        showPreview(res.data.url);
                        layer.msg('上传成功', { icon: 1 });
                    } else {
                        layer.msg(res.msg || '上传失败', { icon: 2 });
                    }
                },
                error: function (xhr) {
                    layer.closeAll('loading');
                    var msg = '上传失败，请重试';
                    try {
                        var r = JSON.parse(xhr.responseText);
                        if (r && r.msg) msg = r.msg;
                    } catch (e) {}
                    layer.msg(msg, { icon: 2 });
                },
                complete: function () {
                    uploading = false;
                    $area.removeClass('loading');
                    $input.val('');
                }
            });
        }

        /* ---------- 确认 ---------- */
        $confirm.on('click', function () {
            if (!selectedUrl) return;
            var storageKey = 'sku_upload_' + fieldParam;
            try {
                parent.sessionStorage.setItem(storageKey, selectedUrl);
                parent.localStorage.setItem('uploaded_image', selectedUrl);
            } catch (e) {}
            var frameIndex = parent.layer.getFrameIndex(window.name);
            parent.layer.close(frameIndex);
        });

        window.getSelectedImage = function () {
            var storageKey = 'sku_upload_' + fieldParam;
            try {
                return parent.sessionStorage.getItem(storageKey) || selectedUrl || '';
            } catch (e) {
                return selectedUrl || '';
            }
        };
    })();
</script>
{/block}
