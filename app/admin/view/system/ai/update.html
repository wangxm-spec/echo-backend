{extend name='public/_container'}
{block name="content"}
<div class="row">
    <form class="form-horizontal" id="doSubmit">
        <div class="col-sm-12">
            <div class="ibox ">
                <div class="ibox-content">
                    <div class="form-group">
                        <label class="col-sm-2 control-label">调用键名：</label>
                        <div class="col-sm-9">
                            <input type="text" autocomplete="off" id="key" value="{$info.key|default=''}" name="key" class="form-control" placeholder="英文唯一标识，如 deepseek">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">标题：</label>
                        <div class="col-sm-9">
                            <input type="text" autocomplete="off" id="title" value="{$info.title|default=''}" name="title" class="form-control" placeholder="如 DeepSeek">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">类型：</label>
                        <div class="col-sm-9">
                            <select name="type" class="form-control chosen" id="type">
                                <option value="ollama" {if condition="$info.type == 'ollama'"}selected{/if}>Ollama</option>
                                <option value="openai" {if condition="$info.type == 'openai'"}selected{/if}>OpenAI兼容</option>
                                <option value="huoshan" {if condition="$info.type == 'huoshan'"}selected{/if}>火山引擎</option>
                                <option value="deepseek" {if condition="$info.type == 'deepseek'"}selected{/if}>DeepSeek</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">配置参数：</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" id="config" name="config" rows="6" placeholder='JSON 格式，如 {"api_key":"xxx","base_url":"https://api.deepseek.com"}'>{php}echo json_encode($info['config'] ?? new \stdClass(), JSON_UNESCAPED_UNICODE);{/php}</textarea>
                            <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 常用字段：api_key、base_url、timeout、retries</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">模型列表：</label>
                        <div class="col-sm-9">
                            {php}$models = $info['models'] ?? [];{/php}
                            <input type="text" autocomplete="off" id="models" value="{:is_array($models) ? implode(',', $models) : $models}" name="models" class="form-control" placeholder="多个模型用英文逗号分隔">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">默认模型：</label>
                        <div class="col-sm-9">
                            <input type="text" autocomplete="off" id="default_model" value="{$info.default_model|default=''}" name="default_model" class="form-control" placeholder="留空默认取模型列表第一个">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">备注：</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" id="desc" name="desc" rows="2" placeholder="请输入备注">{$info.desc|default=''}</textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">状态：</label>
                        <div class="col-sm-9">
                            <select name="status" class="form-control chosen" id="status">
                                <option value="1" {if condition="(int)$info.status === 1"}selected{else/}selected{/if}>正常</option>
                                <option value="0" {if condition="(int)$info.status === 0"}selected{/if}>禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="hr-line-dashed"></div>
                    <div class="row btn-group-m-t">
                        <div class="col-sm-8">
                            <button type="button" class="btn btn-primary" onclick="InfoDlg.submit()" id="ensure">
                                <i class="fa fa-check"></i>&nbsp;确认提交
                            </button>
                            <button type="button" class="btn btn-danger" onclick="InfoDlg.close()" id="cancel"
                                    style="margin-left: 20px">
                                <i class="fa fa-remove"></i>&nbsp;取消关闭
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<script src="/static/admin/js/common/formCom.js" charset="utf-8"></script>
<script type="text/javascript">

    InfoDlg.collectData = function () {
        this.set('key').set('title').set('type').set('config').set('models').set('default_model').set('desc').set('status');
    }

    InfoDlg.Validate = function () {
        if ($('#key').val() === '') {
            com.error('请输入调用键名');
            return false;
        }
        if ($('#title').val() === '') {
            com.error('请输入标题');
            return false;
        }
        var cfg = $('#config').val();
        if (cfg !== '' && cfg !== '[]' && cfg !== '{}') {
            try { JSON.parse(cfg); } catch (e) { com.error('配置参数必须是合法的 JSON'); return false; }
        }
        return true;
    }

    InfoDlg.submit = function () {
        this.ajaxSubmit("{:url('admin/system/ai/update',['id'=>$id])}");
    };

</script>

{/block}
