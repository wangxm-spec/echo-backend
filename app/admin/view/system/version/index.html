{extend name='public/_container'}
{block name="content"}
<div class="row">
    <div class="col-sm-12">
        <div class="ibox float-e-margins">
            <div class="ibox-content">
                <div class="row row-lg">
                    <div class="col-sm-12">
                        <div class="row" id="searchGroup">
                            <div class="col-sm-3">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">关键字</button>
                                    </div>
                                    <input type="text" autocomplete="off" class="form-control" id="keywords" placeholder="标题/版本号"/>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">平台</button>
                                    </div>
                                    <select class="form-control chosen" id="site">
                                        <option value="">全部平台</option>
                                        {foreach $site_list as $key => $item}
                                            <option value="{$key}">{$item}</option>
                                        {/foreach}
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <div class="input-group">
                                    <div class="input-group-btn">
                                        <button data-toggle="dropdown" class="btn btn-white dropdown-toggle" type="button">状态</button>
                                    </div>
                                    <select class="form-control chosen" id="status">
                                        <option value="">全部状态</option>
                                        <option value="1">正常</option>
                                        <option value="0">禁用</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <button type="button" class="btn btn-success" onclick="TableList.search()">
                                    <i class="fa fa-search"></i>&nbsp;搜索
                                </button>
                            </div>
                        </div>
                        <div class="btn-group-sm pull-left" id="TableToolbar" role="group" style="margin-top: 15px;">
                            {if condition="$is_super_admin == 1 || in_array('admin/system/version/update', $admin_rule)"}
                            <button type="button" id="create" class="btn btn-primary button-margin" onclick="TableList.update(0)">
                                <i class="fa fa-plus"></i>&nbsp;添加
                            </button>
                            {/if}
                            {if condition="$is_super_admin == 1 || in_array('admin/system/version/delete', $admin_rule)"}
                            <button type="button" id="delete" class="btn btn-danger button-margin" onclick="TableList.delete()">
                                <i class="fa fa-trash"></i>&nbsp;删除
                            </button>
                            {/if}
                        </div>
                        <table id="TableList" data-mobile-responsive="true" data-click-to-select="true">
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/admin/js/common/listCom.js" charset="utf-8"></script>
<script>
    var TableList = {id: "TableList", seItem: null, table: null, layerIndex: -1};

    TableList.initColumn = function () {
        return [
            {field: 'selectItem', checkbox: true},
            {title: '编号', field: 'id', visible: true, align: 'center', valign: 'middle'},
            {title: '版本ID', field: 'version_id', visible: true, align: 'center', valign: 'middle'},
            {title: '版本号', field: 'version_code', visible: true, align: 'center', valign: 'middle'},
            {title: '平台', field: 'site_text', visible: true, align: 'center', valign: 'middle'},
            {title: '标题', field: 'title', visible: true, align: 'center', valign: 'middle'},
            {title: '是否强制', field: 'is_must_text', visible: true, align: 'center', valign: 'middle'},
            {title: '状态', field: 'status', visible: true, align: 'center', valign: 'middle', formatter: TableList.statusFormatter},
            {title: '发布时间', field: 'push_time', visible: true, align: 'center', valign: 'middle'},
            {title: '操作', field: '', visible: true, align: 'center', valign: 'middle', formatter: TableList.buttonFormatter},
        ];
    };

    TableList.statusFormatter = function (value, row, index) {
        var str = '';
        {if condition="$is_super_admin == 1 || in_array('admin/system/version/status', $admin_rule)"}
        str += listCom.switchBtn(row.id, 'status', value, "{:url('admin/system/version/status')}")
        {/if}
        return str;
    };

    TableList.buttonFormatter = function (value, row, index) {
        var str = '';
        {if condition="$is_super_admin == 1 || in_array('admin/system/version/update', $admin_rule)"}
        str += '<button type="button" class="btn btn-success btn-xs" onclick="TableList.update(' + row.id + ')"><i class="fa fa-pencil"></i>&nbsp;编辑</button>&nbsp;';
        {/if}
        {if condition="$is_super_admin == 1 || in_array('admin/system/version/delete', $admin_rule)"}
        str += '<button type="button" class="btn btn-danger btn-xs" onclick="TableList.delete(' + row.id + ')"><i class="fa fa-trash"></i>&nbsp;删除</button>';
        {/if}
        return str;
    };

    TableList.formParams = function () {
        var queryData = {};
        queryData['keywords'] = $("#keywords").val();
        queryData['site']     = $("#site").val();
        queryData['status']   = $("#status").val();
        return queryData;
    };

    TableList.update = function (value) {
        layer.open({
            type: 2,
            title: value > 0 ? '编辑版本' : '添加版本',
            area: ['760px', '80%'],
            fix: true,
            content: "{:url('admin/system/version/update')}?id=" + value
        });
    };

    TableList.delete = function (value) {
        var ids = value ? value : '';
        if (!ids) {
            var selected = $('#TableList').bootstrapTable('getSelections');
            if (selected.length === 0) { layer.msg('请先选中表格中的记录！', {icon: 2}); return; }
            ids = selected.map(function(item){ return item.id; }).join(',');
        }
        layer.confirm('确定要删除选中的记录吗？', function(index){
            $.ajax({
                url: "{:url('admin/system/version/delete')}", type: 'POST', data: {id: ids}, dataType: 'json',
                success: function(res){
                    if (res.status === 200) { layer.msg(res.msg, {icon: 1}); TableList.table.refresh(); }
                    else { layer.msg(res.msg, {icon: 2}); }
                }
            });
            layer.close(index);
        });
    };

    TableList.search = function () { TableList.table.refresh({query: TableList.formParams()}); };

    $(function () {
        var table = new BSTable(TableList.id, "{:url('admin/system/version/index')}" + location.search, TableList.initColumn());
        table.setQueryParams(TableList.formParams());
        TableList.table = table.init();
    });
</script>
{/block}
