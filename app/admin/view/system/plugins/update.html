{extend name='public/_container'}
{block name="content"}
<div class="row">
    <form class="form-horizontal" id="doSubmit">
        <div class="col-sm-12">
            <div class="ibox ">
                <div class="ibox-content">
                    <div class="form-group">
                        <label class="col-sm-2 control-label">插件标题：</label>
                        <div class="col-sm-9">
                            <input type="text" autocomplete="off" id="title" value="{$info.title|default=''}" name="title" class="form-control" placeholder="请输入插件标题">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">分类：</label>
                        <div class="col-sm-9">
                            <input type="number" autocomplete="off" id="cate" value="{$info.cate|default=0}" name="cate" class="form-control" placeholder="分类ID">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">版本号：</label>
                        <div class="col-sm-9">
                            <input type="text" autocomplete="off" id="version" value="{$info.version|default=''}" name="version" class="form-control" placeholder="如 1.0.0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">下载路径：</label>
                        <div class="col-sm-9">
                            <input type="text" autocomplete="off" id="path" value="{$info.path|default=''}" name="path" class="form-control" placeholder="插件下载地址">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">环境检查：</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" id="env_checker" name="env_checker" rows="4" placeholder='JSON 格式，如 {"os":["win","mac"]}'>{php}echo json_encode($info['env_checker'] ?? new \stdClass(), JSON_UNESCAPED_UNICODE);{/php}</textarea>
                            <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 填写合法的 JSON，留空表示不限制</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">描述：</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" id="desc" name="desc" rows="3" placeholder="请输入插件描述">{$info.desc|default=''}</textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">状态：</label>
                        <div class="col-sm-9">
                            <select name="status" class="form-control chosen" id="status">
                                <option value="1" {if condition="(int)$info.status === 1"}selected{else/}selected{/if}>正常</option>
                                <option value="0" {if condition="(int)$info.status === 0"}selected{/if}>禁用</option>
                                <option value="-1" {if condition="(int)$info.status === -1"}selected{/if}>关闭</option>
                            </select>
                        </div>
                    </div>
                    <div class="hr-line-dashed"></div>
                    <div class="row btn-group-m-t">
                        <div class="col-sm-4"></div>
                        <div class="col-sm-4">
                            <button type="button" class="btn btn-primary" onclick="InfoDlg.submit()" id="ensure">
                                <i class="fa fa-check"></i>&nbsp;确认提交
                            </button>
                            <button type="button" class="btn btn-danger" onclick="InfoDlg.close()" id="cancel"
                                    style="margin-left: 20px">
                                <i class="fa fa-remove"></i>&nbsp;取消关闭
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<script src="/static/admin/js/common/formCom.js" charset="utf-8"></script>
<script type="text/javascript">

    InfoDlg.collectData = function () {
        this.set('title').set('cate').set('version').set('path').set('env_checker').set('desc').set('status');
    }

    InfoDlg.Validate = function () {
        if ($('#title').val() === '') {
            com.error('请输入插件标题');
            return false;
        }
        var env = $('#env_checker').val();
        if (env !== '' && env !== '[]' && env !== '{}') {
            try { JSON.parse(env); } catch (e) { com.error('环境检查必须是合法的 JSON'); return false; }
        }
        return true;
    }

    InfoDlg.submit = function () {
        this.ajaxSubmit("{:url('admin/system/plugins/update',['id'=>$id])}");
    };

</script>

{/block}
