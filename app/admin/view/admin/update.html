{extend name='public/_container'}
{block name="content"}
<div class="row">
    <form class="form-horizontal" id="doSubmit">
        <div class="col-sm-12">
            <div class="ibox ">
                <div class="ibox-content">
                    <div class="form-group">
                        <label class="col-sm-2 control-label">用户名：</label>
                        <div class="col-sm-9">
                            <input type="text" autocomplete="off" id="account" value="{$info.account|default=''}" name="account" class="form-control" placeholder="请输入用户名" {if $id!=0} readonly {/if}>
                        </div>
                    </div>

                    {if $id == 0 }
                    <div class="form-group">
                        <label class="col-sm-2 control-label">密码：</label>
                        <div class="col-sm-9">
                            <input type="password" autocomplete="off" id="password" value="" name="password" class="form-control" placeholder="请输入密码">
                        </div>
                    </div>
                    {/if}

                    <div class="form-group">
                        <label class="col-sm-2 control-label">角色：</label>
                        <div class="col-sm-9">
                            <select name="role_id" class="form-control chosen" id="role_id">
                                {foreach $role_list as $item}
                                    <option value="{$item.id}" {if $item.id == $info.role_id}selected{/if}>{$item.name}</option>
                                {/foreach}
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-2 control-label">状态：</label>
                        <div class="col-sm-9">
                            <select name="status" class="form-control chosen" id="status">
                                <option value="1" {if condition="$info.status == '1' || $info.status == 1"}selected{else/}selected{/if}>正常</option>
                                <option value="0" {if condition="$info.status === '0' || $info.status === 0"}selected{/if}>禁用</option>
                            </select>
                        </div>
                    </div>
                    {if $is_super_admin == 1 }
                    <div class="form-group">
                        <label class="col-sm-2 control-label">是否超级管理员：</label>
                        <div class="col-sm-9">
                            <select name="status" class="form-control chosen" id="is_super_admin">
                                <option value="1" {if condition="$info.is_super_admin == '1' || $info.is_super_admin == 1"}selected{else/}selected{/if}>是</option>
                                <option value="0" {if condition="$info.is_super_admin === '0' || $info.is_super_admin === 0"}selected{/if}>否</option>
                            </select>
                        </div>
                    </div>
                    {/if}
                    <div class="hr-line-dashed"></div>
                    <div class="row btn-group-m-t">
                        <div class="col-sm-4"></div>
                        <div class="col-sm-4">
                            <button type="button" class="btn btn-primary" onclick="InfoDlg.submit()" id="ensure">
                                <i class="fa fa-check"></i>&nbsp;确认提交
                            </button>
                            <button type="button" class="btn btn-danger" onclick="InfoDlg.close()" id="cancel"
                                    style="margin-left: 20px">
                                <i class="fa fa-remove"></i>&nbsp;取消关闭
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<script src="/static/admin/js/common/formCom.js" charset="utf-8"></script>
<script type="text/javascript">

    InfoDlg.collectData = function () {
        this.set('account').set('password').set('role_id').set('status').set('is_super_admin');
    }

    InfoDlg.Validate = function () {
        if ($('#account').val() === '') {
            com.account('请输入用户名');
            return false;
        }
        return true;
    }

    InfoDlg.submit = function () {
        this.ajaxSubmit("{:url('admin/admin/update',['id'=>$id])}");
    };

</script>

{/block}
